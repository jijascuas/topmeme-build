<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Topmeme Local</title>
</head>
<body>
    <h1>Topmeme</h1>
    <p>Click the button below to open the application locally using the Brave browser.</p>
    <button onclick="launchBrave()">Open in Brave</button>

    <script>
        function launchBrave() {
            // Note: The command to open Brave may vary depending on the installation path.
            // On Windows, it is usually located in 'C:\Program Files\BraveSoftware\Brave-Browser\Application\brave.exe'
            // Since we cannot run commands directly from an HTML file, 
            // this button will open the URL in the system's default browser.
            // To ensure it opens in Brave, the user should have Brave as the default browser.
            window.open('http://localhost:8081', '_blank');
        }
    </script>
</body>
</html>
