// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.1.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    // Force Kotlin 2.1.0 — overrides any 1.9.x bundled by react-native-gradle-plugin
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.1.0"
        }
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Force C++20 for all native builds — required by React Native 0.83+ headers (std::format)
subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            try {
                android.defaultConfig.externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++20"
                        arguments "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
                    }
                }
            } catch (Exception ignored) {
                // Sub-project does not use CMake — skip
            }
        }
    }
}

apply plugin: "expo-root-project"
