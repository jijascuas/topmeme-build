// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    // Force Kotlin 2.1.0 — overrides any 1.9.x bundled by react-native-gradle-plugin
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
            force "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.1.20"
        }
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// RN 0.83.2 requires compileSdk 36, AGP 8.12.0, Kotlin 2.1.20, NDK 27.1
// NDK 27.1 ships with LLVM 18 which has full C++20 std::format support

apply plugin: "expo-root-project"
