name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🔧 Install NDK 27.1 & Build-Tools 36 (required by RN 0.83.2)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "build-tools;36.0.0"

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🩹 Patch react-native-iap for RN 0.83 compatibility
        run: |
          IAP_FILE="node_modules/react-native-iap/android/src/play/java/com/dooboolab/rniap/RNIapModule.kt"
          # In RN 0.83, ReactContextBaseJavaModule removed currentActivity — use reactContext.getCurrentActivity()
          sed -i 's/val activity = currentActivity/val activity = reactContext.getCurrentActivity()/' "$IAP_FILE"
          # Explicit !! non-null (null was already handled before the lambda scope)
          sed -i 's/billingClient.launchBillingFlow(activity, flowParams)/billingClient.launchBillingFlow(activity!!, flowParams)/' "$IAP_FILE"
          echo "✅ Patch applied successfully"
          grep -n 'activity' "$IAP_FILE" | head -10

      - name: 🔐 Decode & Place Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Remove any accidental whitespace/newlines from the secret, then decode
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/app/topmeme.keystore
          
          # Validate: a real keystore is always > 1 KB
          FILE_SIZE=$(stat -c%s "android/app/topmeme.keystore")
          echo "✅ Keystore decoded — size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ ERROR: Keystore file is too small (${FILE_SIZE} bytes). KEYSTORE_BASE64 secret is likely truncated or empty."
            echo "   → Go to Settings > Secrets > KEYSTORE_BASE64 and paste the full base64 value."
            exit 1
          fi
          file android/app/topmeme.keystore

      - name: 🔐 Give Execute Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: ⚙️ Build Android APK & AAB
        env:
          MYAPP_RELEASE_STORE_FILE: topmeme.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=topmeme.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      - name: 🔍 List Android Build Outputs (Debug)
        run: |
          echo "=== APKs ==="
          find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found"
          echo "=== AABs ==="
          find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null || echo "No AABs found"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-APK-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
