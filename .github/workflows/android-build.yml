name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🔑 Setup Persistent Keystore
        run: |
          if [ ! -f topmeme.keystore ]; then
            keytool -genkey -v -keystore topmeme.keystore -alias topmeme-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass topmeme123 -keypass topmeme123 -dname "CN=Topmeme, OU=Build, O=Jijascuas, L=Unknown, S=Unknown, C=ES" -noprompt
            
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add topmeme.keystore
            git commit -m "Auto-generate persistent keystore for Topmeme" || true
            git push || true
          fi

      - name: 🏗️ Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Build Android APK & AAB
        run: |
          cd android
          chmod +x gradlew
          # Run both builds in one command to share intermediate outputs and ensure signing
          ./gradlew assembleRelease bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=${{ github.workspace }}/topmeme.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD=topmeme123 \
            -PMYAPP_RELEASE_KEY_ALIAS=topmeme-alias \
            -PMYAPP_RELEASE_KEY_PASSWORD=topmeme123 \
            --no-daemon --stacktrace --info

      - name: 🔍 List Android Build Outputs (Debug)
        run: |
          echo "Checking APKs:"
          find android/app/build/outputs/apk -name "*.apk" || echo "No APKs found"
          echo "Checking Bundles:"
          find android/app/build/outputs/bundle -name "*.aab" || echo "No AABs found"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-APK-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 📤 Upload Keystore (Key)
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Key-Store
          path: topmeme.keystore
          if-no-files-found: warn
