name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🔐 Decode & Place Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > topmeme.keystore
          cp topmeme.keystore android/app/topmeme.keystore

      - name: 🔐 Give Execute Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: ⚙️ Build Android APK & AAB
        env:
          MYAPP_RELEASE_STORE_FILE: topmeme.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease \
            -PMYAPP_RELEASE_STORE_FILE=topmeme.keystore \
            -PMYAPP_RELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PMYAPP_RELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PMYAPP_RELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      - name: 🔍 List Android Build Outputs (Debug)
        run: |
          echo "=== APKs ==="
          find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found"
          echo "=== AABs ==="
          find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null || echo "No AABs found"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-APK-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
