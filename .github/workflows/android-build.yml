name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install dependencies
        run: npm ci

      - name: 🏗️ Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --no-install

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🔑 Generate Release Keystore
        run: |
          if [ ! -f topmeme.keystore ]; then
            keytool -genkey -v -keystore topmeme.keystore -alias topmeme-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass topmeme123 -keypass topmeme123 -dname "CN=Topmeme, OU=Build, O=Jijascuas, L=Unknown, S=Unknown, C=ES" -noprompt
          fi

      - name: ⚙️ Build Android APK & AAB (Release Signed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=../topmeme.keystore \
            -Pandroid.injected.signing.store.password=topmeme123 \
            -Pandroid.injected.signing.key.alias=topmeme-alias \
            -Pandroid.injected.signing.key.password=topmeme123 \
            --no-daemon --stacktrace

      - name: 📂 Organize Artifacts
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then cp "$APK_PATH" build-output/topmeme-release.apk; fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ]; then cp "$AAB_PATH" build-output/topmeme-release.aab; fi
          cp topmeme.keystore build-output/

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Android-Builds
          path: build-output/
