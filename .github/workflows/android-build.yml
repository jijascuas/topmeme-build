name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🛠️ Install dependencies
        run: npm install

      - name: 🔑 Setup Persistent Keystore
        run: |
          if [ ! -f topmeme.keystore ]; then
            keytool -genkey -v -keystore topmeme.keystore -alias topmeme-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass topmeme123 -keypass topmeme123 -dname "CN=Topmeme, OU=Build, O=Jijascuas, L=Unknown, S=Unknown, C=ES" -noprompt
            
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add topmeme.keystore
            git commit -m "Auto-generate persistent keystore for Topmeme" || true
            git push || true
          fi

      - name: 🏗️ Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --no-install

      - name: ⚙️ Build Android APK & AAB
        run: |
          cd android
          chmod +x gradlew
          # Build APK (Release) and AAB (Release)
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=../topmeme.keystore \
            -Pandroid.injected.signing.store.password=topmeme123 \
            -Pandroid.injected.signing.key.alias=topmeme-alias \
            -Pandroid.injected.signing.key.password=topmeme123 \
            --no-daemon --stacktrace
          
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../topmeme.keystore \
            -Pandroid.injected.signing.store.password=topmeme123 \
            -Pandroid.injected.signing.key.alias=topmeme-alias \
            -Pandroid.injected.signing.key.password=topmeme123 \
            --no-daemon --stacktrace

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-APK-Release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-AAB-Release
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: 📤 Upload Keystore (Key)
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Key-Store
          path: topmeme.keystore
