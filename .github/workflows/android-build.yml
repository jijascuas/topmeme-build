name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: 🛠️ Install dependencies
        run: npm install

      - name: 🔐 Give Execute Permissions to Gradlew
        run: chmod +x android/gradlew

      - name: ⚙️ Build Android APK & AAB
        run: |
          cd android
          # Desactivamos el daemon para que no consuma memoria extra
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: 🔍 List Android Build Outputs (Debug)
        run: |
          echo "Checking APKs:"
          find android/app/build/outputs/apk -name "*.apk" || echo "No APKs found"
          echo "Checking Bundles:"
          find android/app/build/outputs/bundle -name "*.aab" || echo "No AABs found"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-APK-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-AAB-Release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 📤 Upload Keystore (Key)
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Key-Store
          path: topmeme.keystore
          if-no-files-found: warn
