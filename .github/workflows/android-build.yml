name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install dependencies
        run: npm install

      - name: 🏗️ Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Generate Release Keystore
        run: |
          keytool -genkey -v -keystore topmeme.keystore -alias topmeme-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass topmeme123 -keypass topmeme123 -dname "CN=Topmeme, OU=Build, O=Jijascuas, L=Unknown, S=Unknown, C=ES"

      - name: ⚙️ Build APK & AAB (Release)
        run: |
          cd android
          # Compilar sin firmar inicialmente (unsigned)
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 📂 Organize Files
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/topmeme-release-unsigned.apk || cp android/app/build/outputs/apk/release/*.apk build-output/
          cp android/app/build/outputs/bundle/release/app-release.aab build-output/topmeme-release.aab || cp android/app/build/outputs/bundle/release/*.aab build-output/
          cp topmeme.keystore build-output/

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Android-Build
          path: build-output/
