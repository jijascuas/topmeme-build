name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repo
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to 22
          cache: 'npm'

      - name: 🛠️ Install dependencies
        run: npm install

      - name: 🏗️ Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --no-install

      - name: 🔑 Generate Release Keystore
        run: |
          keytool -genkey -v -keystore topmeme.keystore -alias topmeme-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass topmeme123 -keypass topmeme123 -dname "CN=Topmeme, OU=Build, O=Jijascuas, L=Unknown, S=Unknown, C=ES"

      - name: ⚙️ Build Android APK & AAB
        run: |
          cd android
          chmod +x gradlew
          # Build APK (Debug) for quick testing
          ./gradlew assembleDebug
          # Build App Bundle (Release)
          ./gradlew bundleRelease --stacktrace

      - name: 📂 Organize Artifacts
        run: |
          mkdir -p build-output
          # Copy APK
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/topmeme-app.apk \;
          # Copy AAB
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} build-output/topmeme-release.aab \;
          # Copy Keystore
          cp topmeme.keystore build-output/

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Topmeme-Android-Artifacts
          path: build-output/
